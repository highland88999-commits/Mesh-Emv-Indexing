<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS VORTEX - DYNAMIC ASSET MANIFEST</title>

<!-- SUPABASE UPLINK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root {
        --cyan: #00ffff;
        --pink: #ff00ff;
        --bg-dark: #010103;
        --bg-panel: #0a0a0f;
    }

    body {
        margin: 0; padding: 40px;
        background-color: var(--bg-dark);
        color: var(--cyan);
        font-family: 'Courier New', Courier, monospace;
    }

    .header-container {
        border-bottom: 2px solid var(--pink);
        padding-bottom: 20px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    h1 {
        margin: 0; font-size: 2.5rem; letter-spacing: 4px;
        text-shadow: 0 0 15px var(--cyan);
        color: #fff;
    }

    .subtitle {
        font-size: 1rem; letter-spacing: 2px; color: var(--pink);
        margin-top: 10px;
    }

    /* Injection Form Styles */
    .injection-panel {
        background-color: var(--bg-panel);
        border: 1px solid var(--cyan);
        padding: 20px;
        margin-bottom: 30px;
        display: flex;
        gap: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        align-items: center;
        flex-wrap: wrap;
    }

    .injection-panel input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 255, 255, 0.5);
        color: var(--cyan);
        padding: 10px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        outline: none;
        flex: 1;
        min-width: 150px;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .injection-panel input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .injection-panel input::placeholder { color: rgba(0, 255, 255, 0.3); }

    table {
        width: 100%; border-collapse: collapse;
        background-color: var(--bg-panel);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }

    th, td {
        padding: 15px; text-align: left;
        border: 1px solid rgba(0, 255, 255, 0.3);
    }

    th {
        background-color: rgba(255, 0, 255, 0.1);
        color: var(--pink);
        font-weight: bold; letter-spacing: 2px;
    }

    td { font-size: 0.9rem; word-break: break-all; }

    .index-id { font-weight: bold; color: #fff; }
    .asset-type { color: #aaaaaa; }

    a {
        color: var(--cyan); text-decoration: none;
        transition: text-shadow 0.3s ease;
    }

    a:hover { text-shadow: 0 0 10px var(--cyan); }

    /* Buttons */
    .btn-action {
        background: transparent; color: var(--cyan);
        border: 1px solid var(--cyan); padding: 10px 20px;
        font-family: inherit; font-size: 1rem; font-weight: bold;
        letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease;
        white-space: nowrap;
    }
    .btn-action:hover {
        background: var(--cyan); color: var(--bg-dark);
        box-shadow: 0 0 15px var(--cyan);
    }

    .sys-msg { color: var(--pink); font-size: 0.85rem; margin-top: 10px; display: block; }
    .error-msg { color: #ff003c; text-shadow: 0 0 10px #ff003c; }

    /* Print-Specific Styles */
    @media print {
        @page { size: landscape; margin: 10mm; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: var(--bg-dark) !important; padding: 0; }
        .no-print { display: none !important; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; page-break-after: auto; }
        td, th { border-color: #333 !important; }
    }
</style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1>NEXUS VORTEX</h1>
            <div class="subtitle">DYNAMIC ASSET MANIFEST & DB UPLINK</div>
            <div id="sys-status" class="sys-msg">ESTABLISHING OMEGA MIND LINK...</div>
        </div>
        <button class="btn-action no-print" onclick="window.print()">[ EXPORT TO PDF ]</button>
    </div>

    <!-- Data Injection Panel -->
    <div class="injection-panel no-print">
        <input type="text" id="inp-id" placeholder="INDEX_ID (e.g. BIOME_01)">
        <input type="text" id="inp-type" placeholder="TYPE (e.g. Audio .mp3)">
        <input type="text" id="inp-desc" placeholder="DESCRIPTION / ASSIGNMENT">
        <input type="url" id="inp-url" placeholder="RAW URL (https://...)">
        <button class="btn-action" id="btn-inject" onclick="injectAsset()">[ INJECT ASSET ]</button>
    </div>

    <!-- Live Data Table -->
    <table>
        <thead>
            <tr>
                <th width="15%">INDEX ID</th>
                <th width="15%">TYPE</th>
                <th width="25%">DESCRIPTION / ASSIGNMENT</th>
                <th width="45%">RAW URL</th>
            </tr>
        </thead>
        <tbody id="manifest-body">
            <!-- Data injected via Supabase -->
            <tr><td colspan="4" style="text-align:center; color:#555;">Awaiting telemetry...</td></tr>
        </tbody>
    </table>

<script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://amulgdbdvxpikpmldyoq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtdWxnZGJkdnhwaWtwbWxkeW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDU3MzgsImV4cCI6MjEwMTk4MTczOH0.0eZ3SfWhUEzSLpDDKEE_3vp5siXF00akRp5jX1dM-dA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const manifestBody = document.getElementById('manifest-body');
    const sysStatus = document.getElementById('sys-status');

    // 2. Fetch Assets from Supabase
    async function fetchAssets() {
        try {
            const { data, error } = await supabase
                .from('asset_manifest')
                .select('*')
                .order('index_id', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
                manifestBody.innerHTML = ''; // Clear table
                data.forEach(asset => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="index-id">${escapeHTML(asset.index_id)}</td>
                        <td class="asset-type">${escapeHTML(asset.asset_type)}</td>
                        <td>${escapeHTML(asset.description)}</td>
                        <td><a href="${escapeHTML(asset.raw_url)}" target="_blank">${escapeHTML(asset.raw_url)}</a></td>
                    `;
                    manifestBody.appendChild(row);
                });
                sysStatus.innerText = `LINK SECURE. FETCHED ${data.length} ASSETS.`;
                sysStatus.className = "sys-msg";
            } else {
                manifestBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">DATABASE EMPTY. RUN SQL SCRIPT.</td></tr>';
            }
        } catch (err) {
            console.error("Database Error:", err);
            sysStatus.innerText = "ERROR: FAILED TO FETCH. DID YOU RUN THE SQL SCRIPT?";
            sysStatus.className = "sys-msg error-msg";
            manifestBody.innerHTML = `<tr><td colspan="4" class="error-msg" style="text-align:center;">${err.message}</td></tr>`;
        }
    }

    // 3. Inject New Asset to Supabase
    async function injectAsset() {
        const idInput = document.getElementById('inp-id');
        const typeInput = document.getElementById('inp-type');
        const descInput = document.getElementById('inp-desc');
        const urlInput = document.getElementById('inp-url');
        const btnInject = document.getElementById('btn-inject');

        const payload = {
            index_id: idInput.value.trim().toUpperCase(),
            asset_type: typeInput.value.trim(),
            description: descInput.value.trim(),
            raw_url: urlInput.value.trim()
        };

        if (!payload.index_id || !payload.raw_url) {
            alert("INDEX_ID and RAW_URL are required fields.");
            return;
        }

        btnInject.innerText = "[ PROCESSING... ]";
        btnInject.style.pointerEvents = "none";

        try {
            const { error } = await supabase.from('asset_manifest').insert([payload]);
            if (error) throw error;

            // Clear form and refresh table on success
            idInput.value = ''; typeInput.value = ''; descInput.value = ''; urlInput.value = '';
            sysStatus.innerText = `SUCCESS: INJECTED ${payload.index_id} INTO DB.`;
            await fetchAssets();
            
        } catch (err) {
            console.error("Injection Error:", err);
            alert("Failed to inject: " + err.message);
        } finally {
            btnInject.innerText = "[ INJECT ASSET ]";
            btnInject.style.pointerEvents = "auto";
        }
    }

    // Security helper to prevent XSS in table rendering
    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
        );
    }

    // Load on init
    window.addEventListener('DOMContentLoaded', fetchAssets);

    // Baseline Telemetry
    (function() {
        const REPO_NAME = window.OMEGA_REPO_NAME || window.location.hostname || 'Manifest-Node';
        let clientIP = 'Detecting...';
        fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => { clientIP = data.ip; }).catch(() => {});
        window.logBrainAction = async function(actionType, details = {}) {
            try {
                await supabase.from('central_telemetry').insert([{
                    repository_name: REPO_NAME, action_type: actionType,
                    details: { ...details, ip_address: clientIP, url: window.location.href, timestamp: new Date().toISOString() }
                }]);
            } catch (err) {}
        };
        window.addEventListener('load', () => window.logBrainAction('page_load', { title: document.title }));
    })();
</script>

</body>
</html>
