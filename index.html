<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS VORTEX - DYNAMIC ASSET MANIFEST</title>

<!-- SUPABASE UPLINK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root {
        --cyan: #00ffff;
        --pink: #ff00ff;
        --bg-dark: #010103;
        --bg-panel: rgba(10, 10, 15, 0.75); /* Made transparent for video */
    }

    body {
        margin: 0; padding: 40px;
        color: var(--cyan);
        font-family: 'Courier New', Courier, monospace;
        position: relative;
        min-height: 100vh;
    }

    /* ────────────────────────────────────────────────
       Background Video Integration
       ──────────────────────────────────────────────── */
    .bg-video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover; /* Ensures perfect scaling on all devices */
        z-index: -2;
        filter: grayscale(30%) brightness(0.6) contrast(1.2);
    }

    .video-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: linear-gradient(to bottom, rgba(1,1,3,0.6), rgba(1,1,3,0.9));
        z-index: -1;
        pointer-events: none;
    }

    /* ────────────────────────────────────────────────
       UI Elements
       ──────────────────────────────────────────────── */
    .header-container {
        border-bottom: 2px solid var(--pink);
        padding-bottom: 20px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 20px;
        position: relative;
    }

    h1 {
        margin: 0; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: 4px;
        text-shadow: 0 0 15px var(--cyan);
        color: #fff;
    }

    .subtitle {
        font-size: 1rem; letter-spacing: 2px; color: var(--pink);
        margin-top: 10px;
    }

    /* Injection & Extraction Panels */
    .control-panel {
        background-color: var(--bg-panel);
        border: 1px solid var(--cyan);
        padding: 20px;
        margin-bottom: 30px;
        display: flex;
        gap: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        align-items: center;
        flex-wrap: wrap;
        backdrop-filter: blur(8px); /* Frosts the video behind the panel */
        -webkit-backdrop-filter: blur(8px);
    }

    .control-panel input {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(0, 255, 255, 0.5);
        color: var(--cyan);
        padding: 10px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        outline: none;
        flex: 1;
        min-width: 150px;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .control-panel input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .control-panel input::placeholder { color: rgba(0, 255, 255, 0.3); }

    /* Tables */
    .table-container {
        width: 100%;
        overflow-x: auto; /* Fixes layout breaking on small phones */
    }

    table {
        width: 100%; border-collapse: collapse;
        background-color: var(--bg-panel);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        margin-bottom: 30px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    th, td {
        padding: 15px; text-align: left;
        border: 1px solid rgba(0, 255, 255, 0.3);
    }

    th {
        background-color: rgba(255, 0, 255, 0.15);
        color: var(--pink);
        font-weight: bold; letter-spacing: 2px;
    }

    td { font-size: 0.9rem; word-break: break-all; color: #fff; }

    .index-id { font-weight: bold; color: var(--cyan); }
    .asset-type { color: #aaaaaa; }

    a {
        color: var(--pink); text-decoration: none;
        transition: text-shadow 0.3s ease;
    }

    a:hover { text-shadow: 0 0 10px var(--pink); }

    /* Buttons */
    .btn-action {
        background: rgba(0, 0, 0, 0.5); color: var(--cyan);
        border: 1px solid var(--cyan); padding: 10px 20px;
        font-family: inherit; font-size: 1rem; font-weight: bold;
        letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease;
        white-space: nowrap; backdrop-filter: blur(4px);
    }
    .btn-action:hover {
        background: var(--cyan); color: var(--bg-dark);
        box-shadow: 0 0 15px var(--cyan);
    }
    .btn-alt { border-color: var(--pink); color: var(--pink); }
    .btn-alt:hover { background: var(--pink); color: var(--bg-dark); box-shadow: 0 0 15px var(--pink); }

    .sys-msg { color: var(--pink); font-size: 0.85rem; margin-top: 10px; display: block; font-weight: bold;}
    .error-msg { color: #ff003c !important; text-shadow: 0 0 10px #ff003c; }

    /* Extraction Console */
    #extraction-console {
        background: rgba(0, 0, 0, 0.8); border: 1px solid var(--pink); color: var(--pink);
        padding: 15px; margin-bottom: 30px; font-family: monospace; font-size: 0.85rem;
        height: 200px; overflow-y: auto; display: none; white-space: pre-wrap;
        backdrop-filter: blur(8px);
    }

    /* Mobile Adaptability */
    @media (max-width: 768px) {
        body { padding: 20px; }
        .header-container { flex-direction: column; align-items: flex-start; }
        .btn-action { width: 100%; text-align: center; }
        .header-container div:last-child { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    }

    /* Print-Specific Styles */
    @media print {
        @page { size: landscape; margin: 10mm; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background-color: var(--bg-dark) !important; padding: 0; }
        .bg-video, .video-overlay, .no-print { display: none !important; }
        table { page-break-inside: auto; background-color: #000 !important; }
        tr { page-break-inside: avoid; page-break-after: auto; }
        td, th { border-color: #333 !important; }
    }
</style>
</head>
<body>

    <!-- Responsive Background Video Elements -->
    <video class="bg-video" id="bgVideo" src="https://files.catbox.moe/gmgn0b.mp4" autoplay loop muted playsinline></video>
    <div class="video-overlay"></div>

    <div class="header-container">
        <div>
            <h1>NEXUS VORTEX</h1>
            <div class="subtitle">DYNAMIC ASSET MANIFEST & DB UPLINK</div>
            <div id="sys-status" class="sys-msg">INITIALIZING SYSTEM...</div>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-action btn-alt no-print" onclick="testPayloadExtraction()">[ TEST PAYLOAD EXTRACT ]</button>
            <button class="btn-action no-print" onclick="window.print()">[ EXPORT TO PDF ]</button>
        </div>
    </div>

    <!-- Payload Extraction Console -->
    <div id="extraction-console" class="no-print">Awaiting extraction command...</div>

    <!-- Data Injection Panel -->
    <div class="control-panel no-print">
        <input type="text" id="inp-id" placeholder="INDEX_ID (e.g. BIOME_01)">
        <input type="text" id="inp-type" placeholder="TYPE (e.g. Video .mp4)">
        <input type="text" id="inp-desc" placeholder="DESCRIPTION / ASSIGNMENT">
        <input type="url" id="inp-url" placeholder="RAW URL (https://...)">
        <button class="btn-action" id="btn-inject" onclick="injectAsset()">[ INJECT ASSET ]</button>
    </div>

    <!-- Live Data Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="15%">INDEX ID</th>
                    <th width="15%">TYPE</th>
                    <th width="25%">DESCRIPTION / ASSIGNMENT</th>
                    <th width="25%">RAW URL</th>
                    <th width="20%">ORIGIN</th>
                </tr>
            </thead>
            <tbody id="manifest-body">
                <tr><td colspan="5" style="text-align:center; color:#555;">Awaiting telemetry...</td></tr>
            </tbody>
        </table>
    </div>

<script>
    // iOS safety override to guarantee background video playback
    document.body.addEventListener('click', () => {
        const vid = document.getElementById('bgVideo');
        if (vid && vid.paused) vid.play().catch(e => console.log(e));
    }, { once: true });

    const manifestBody = document.getElementById('manifest-body');
    const sysStatus = document.getElementById('sys-status');
    const extractionConsole = document.getElementById('extraction-console');
    
    const OMEGA_REPO_NAME = 'mesh-emv-indexing.vercel.app';
    let dbClient = null;

    // Boot Engine with Retry Logic
    function bootSystem() {
        if (window.supabase) {
            initSupabase();
        } else {
            sysStatus.innerText = "WAITING FOR CDN CONNECTION...";
            let retries = 0;
            let checkInterval = setInterval(() => {
                if (window.supabase) {
                    clearInterval(checkInterval);
                    initSupabase();
                }
                if (retries++ > 50) { 
                    clearInterval(checkInterval);
                    sysStatus.innerText = "CRITICAL: SUPABASE SCRIPT BLOCKED BY BROWSER OR NETWORK.";
                    sysStatus.className = "sys-msg error-msg";
                    manifestBody.innerHTML = '<tr><td colspan="5" class="error-msg" style="text-align:center;">Network Error: Cannot reach Supabase CDN. Check Adblockers.</td></tr>';
                }
            }, 100);
        }
    }

    async function initSupabase() {
        sysStatus.innerText = "ESTABLISHING OMEGA MIND LINK...";
        try {
            const SUPABASE_URL = 'https://amulgdbdvxpikpmldyoq.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtdWxnZGJkdnhwaWtwbWxkeW9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDU3MzgsImV4cCI6MjEwMTk4MTczOH0.0eZ3SfWhUEzSLpDDKEE_3vp5siXF00akRp5jX1dM-dA';
            
            dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            await fetchAssets();
            initTelemetry();

        } catch (err) {
            console.error("Init Error:", err);
            sysStatus.innerText = "CRITICAL ERROR: " + err.message;
            sysStatus.className = "sys-msg error-msg";
        }
    }

    async function fetchAssets() {
        try {
            const { data, error } = await dbClient
                .from('asset_manifest')
                .select('*')
                .order('index_id', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
                manifestBody.innerHTML = ''; 
                data.forEach(asset => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="index-id">${escapeHTML(asset.index_id)}</td>
                        <td class="asset-type">${escapeHTML(asset.asset_type)}</td>
                        <td>${escapeHTML(asset.description)}</td>
                        <td><a href="${escapeHTML(asset.raw_url)}" target="_blank">LINK</a></td>
                        <td style="color:#888; font-size:0.75rem;">${escapeHTML(asset.origin_repo)}</td>
                    `;
                    manifestBody.appendChild(row);
                });
                sysStatus.innerText = `LINK SECURE. FETCHED ${data.length} ASSETS.`;
                sysStatus.className = "sys-msg";
            } else {
                manifestBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">DATABASE CONNECTED BUT EMPTY.</td></tr>';
                sysStatus.innerText = `LINK SECURE. 0 ASSETS FOUND.`;
                sysStatus.className = "sys-msg";
            }
        } catch (err) {
            console.error("Database Fetch Error:", err);
            sysStatus.innerText = "ERROR: FAILED TO FETCH. DID YOU RUN THE SQL SCRIPT?";
            sysStatus.className = "sys-msg error-msg";
            manifestBody.innerHTML = `<tr><td colspan="5" class="error-msg" style="text-align:center;">Database Error: ${err.message}</td></tr>`;
        }
    }

    window.injectAsset = async function() {
        if (!dbClient) return alert("System not initialized.");

        const idInput = document.getElementById('inp-id');
        const typeInput = document.getElementById('inp-type');
        const descInput = document.getElementById('inp-desc');
        const urlInput = document.getElementById('inp-url');
        const btnInject = document.getElementById('btn-inject');

        const payload = {
            index_id: idInput.value.trim().toUpperCase(),
            asset_type: typeInput.value.trim(),
            description: descInput.value.trim(),
            raw_url: urlInput.value.trim(),
            origin_repo: window.location.hostname || OMEGA_REPO_NAME,
            origin_url: window.location.href
        };

        if (!payload.index_id || !payload.raw_url) {
            alert("INDEX_ID and RAW_URL are required fields.");
            return;
        }

        btnInject.innerText = "[ PROCESSING... ]";
        btnInject.style.pointerEvents = "none";

        try {
            const { error } = await dbClient.from('asset_manifest').insert([payload]);
            if (error) throw error;

            idInput.value = ''; typeInput.value = ''; descInput.value = ''; urlInput.value = '';
            sysStatus.innerText = `SUCCESS: INJECTED ${payload.index_id} FROM ${payload.origin_repo}.`;
            sysStatus.className = "sys-msg";
            await fetchAssets();
            
        } catch (err) {
            console.error("Injection Error:", err);
            alert("Failed to inject: " + err.message);
        } finally {
            btnInject.innerText = "[ INJECT ASSET ]";
            btnInject.style.pointerEvents = "auto";
        }
    }

    window.testPayloadExtraction = async function() {
        extractionConsole.style.display = 'block';
        extractionConsole.innerText = "Initiating payload extraction via RPC...";
        
        try {
            const { data: payload, error } = await dbClient.rpc('extract_asset_payload');
            
            if (error) throw error;

            extractionConsole.innerText = `[SUCCESS] Payload Extracted (${payload.length} objects):\n\n` + JSON.stringify(payload, null, 2);
        } catch (err) {
            extractionConsole.innerText = `[SYS_ERR] RPC Extraction Failed:\n${err.message}\n\nDid you run the SQL script to create the 'extract_asset_payload' function?`;
        }
    }

    function escapeHTML(str) {
        if (!str) return "UNKNOWN";
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
        );
    }

    function initTelemetry() {
        let clientIP = 'Detecting...';
        fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => { clientIP = data.ip; }).catch(() => {});
        window.logBrainAction = async function(actionType, details = {}) {
            try {
                await dbClient.from('central_telemetry').insert([{
                    repository_name: window.location.hostname || OMEGA_REPO_NAME, 
                    action_type: actionType,
                    details: { ...details, ip_address: clientIP, url: window.location.href, timestamp: new Date().toISOString() }
                }]);
            } catch (err) {}
        };
        window.logBrainAction('page_load', { title: document.title });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootSystem);
    } else {
        bootSystem();
    }
</script>

</body>
</html>
