name: Nexus Asset Data Extraction

on:
  workflow_dispatch: # Allows manual trigger via GitHub UI
  schedule:
    - cron: '0 0 * * *' # Auto-runs daily at midnight UTC

jobs:
  extract-and-commit:
    name: Extract Supabase Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Run Extraction Uplink
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node extract-manifest.js

      - name: Commit and Push Static JSON
        run: |
          git config --global user.name "Omega-Mind-Bot"
          git config --global user.email "bot@omegamind.nexus"
          git add public/asset-manifest.json
          # Only commit if the JSON file actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Auto-sync asset-manifest.json from Supabase"
          git push origin main
